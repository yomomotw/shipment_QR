<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}出貨標籤與叫修系統{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% if user %}
<header class="top no-print">
  <h1>出貨標籤與叫修</h1>
  <nav>
    {% if user.role in ('manager', 'agent') %}
    <a href="/devices">設備台帳</a>
    <a href="/devices/new">建檔與印標籤</a>
    {% endif %}
    {% if user.role == 'manager' %}
    <a href="/admin/settings">系統設定</a>
    <a href="/admin/users">使用者</a>
    {% endif %}
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <span>{{ user.name }}（{{ ROLE_LABELS[user.role] }}）</span>
    <button class="link" type="submit">登出</button>
  </form>
</header>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
